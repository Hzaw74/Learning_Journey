<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Details - Hotel Aphrodite</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="container">
            <nav>
                <a href="index.html" class="logo">HOTEL APHRODITE</a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="rooms.html" class="active">Rooms</a></li>
                    <li><a href="booking.html">Book</a></li>
                    <li><a href="dining.html">Dining</a></li>
                    <li><a href="offers.html">Offers</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="room-details-section">
        <div class="container">
            <a href="rooms.html" class="room-back-link">&larr; Back to Rooms</a>

            <div class="room-header">
                <h1 id="room-title">Room Title</h1>
                <p id="room-price">$000 / night</p>
            </div>

            <div class="image-viewer">
                <img id="room-img" src="" alt="Room Image">
                <div class="viewer-controls">
                    <button class="control-btn" onclick="prevImage()">← Previous</button>
                    <button class="control-btn" onclick="nextImage()">Next →</button>
                </div>
            </div>

            <div class="room-info-grid">
                <div class="room-description">
                    <h2>About This Room</h2>
                    <p id="room-description">Loading room details...</p>

                    <h3>Amenities</h3>
                    <ul class="room-amenities" id="room-amenities">
                    </ul>
                </div>

                <div class="room-sidebar">
                    <div class="booking-card">
                        <h3>Book This Room</h3>
                        <p>Reserve your stay now and enjoy luxury accommodation.</p>
                        <a href="booking.html" class="btn">Book Now</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <div class="copyright">
                &copy; 2025 Hotel Aphrodite. All rights reserved.
            </div>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
