<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 1rem;
            align-items: start;
        }
    </style>
</head>

<body>
    <h1>Novell Services Login</h1>

    <form>
        <div>
            <label>Username:</label>
            <input type="text">
        </div>
        <div>
            <label>Password:</label>
            <input type="password">
        </div>
        <div>
            <label>City of Employment:</label>
            <input type="text">
        </div>
        <div">
            <label>Webserver:</label>
            <select size="3">
                <option>-- Choose a server --</option>
                <option>Human Resources</option>
                <option>Development</option>
                <option>Accounting</option>
                <option>Sales</option>
            </select>
        </div>
        <div class="grid">
            <div>
                <label>Please specify your role</label>
            </div>
            <div>
                <input type="radio">
                <label>Admin</label>
                <br>
                <input type="radio">
                <label>Admin</label>
                <br>
                <input type="radio">
                <label>Admin</label>
                <br>
                <input type="radio">
                <label>Admin</label>
            </div>
        </div>
    </form>
</body>
</html>
