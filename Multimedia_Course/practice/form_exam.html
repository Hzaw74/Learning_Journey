<!DOCTYPE html>
<html lang="en">

<head>
    <title>Pete's Pizza Delivery</title>
    <style>
        body {
            line-height: 30px;
        }
        h1, h3 {
            text-align: center;
        }
        
        fieldset{
            width: 40%;
            margin: auto;
        }

        label {
            display: inline-block;
            width: 100px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"] {
            width: 70%;
        }

        input[type="radio"],
        input[type="checkbox"]{
            display: inline;
            width: auto;
        }

        textarea {
            display: block;
            width: 90%;
        }

        #time {
            display: inline-block;
            width: 180px;
        }

        #instruction {
            width: 150px;
        }

        button {
            display: block;
            margin: auto;
            padding: 4px;
        }
    </style>
</head>

<body>
    <h1>Pete's Pizza Delivery</h1>
    <h3>Online Order Form</h3>

    <form>
        <fieldset>
            <legend>Customer details</legend>

            <label>*Name:</label>
            <input type="text" required>
            <br>

            <label>*Address:</label>
            <input type="text" required>
            <br>

            <label>*Town/city:</label>
            <input type="text" required>
            <br>

            <label>*Postcode:</label>
            <input type="text" required>
            <br>

            <label>*Tel:</label>
            <input type="tel" required>
            <br>

            <label>*Email:</label>
            <input type="email" required>
        </fieldset>

        <br>

        <fieldset>
            <legend>Size *</legend>
            
            <input type="radio" name="size">
            <label>Small</label>
            <br>

            <input type="radio" name="size">
            <label>Medium</label>
            <br>

            <input type="radio" name="size">
            <label>Large</label>
        </fieldset>

        <br>

        <fieldset>
            <legend>Delivery</legend>

            <label id="time">Preferred delivery time:</label>
            <input type="time">
            <br>

            <label id="instruction">Delivery instructions:</label>
            <br>
            <textarea rows="3" cols="50"></textarea>
        </fieldset>

        <br>

        <button type="submit">Submit Order</button>
    </form>
</body>

</html>
